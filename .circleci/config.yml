version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

parameters:
  ruby-version:
    type: string
    default: "3.4.11"
    description: >-
      Ruby version for the acceptance and smoke tests to install.

executors:
  go:
    docker:
      - image: cimg/go:1.26
  base:
    docker:
      - image: cimg/base:stable
  alpine:
    docker:
      - image: alpine:3
  ubi:
    docker:
      - image: redhat/ubi9:latest
  arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
  macos:
    macos:
      xcode: "16.4.0"
  windows:
    machine:
      image: windows-server-2022-gui:current
      shell: bash.exe -eo pipefail
    resource_class: windows.medium

jobs:
  test:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-ruby-go-{{ checksum "go.sum" }}-
            - setup-ruby-go-
      - run: task lint
      - run: task lint-tasks
      - run: task test
      - store_test_results:
          path: test-results
      - save_cache:
          key: setup-ruby-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Real Ruby downloads, real gem installs and a real task-agent cache
  # (TOOLKIT_CACHE_MODE=live). The install-anywhere smoke test is left to the
  # smoke jobs, which run it on executors that are disposable.
  acceptance:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-ruby-go-{{ checksum "go.sum" }}-
            - setup-ruby-go-
      - run:
          name: Run acceptance tests
          command: task acceptance -- -skip '^TestAcceptance_InstallsOntoTheRealPath$'
          environment:
            SETUP_RUBY_ACCEPTANCE_VERSION: << pipeline.parameters.ruby-version >>
            TOOLKIT_CACHE_MODE: live
      - store_test_results:
          path: test-results

  # Cross-compiles setup-ruby into ./dist and persists it to the workspace, so
  # the smoke jobs exercise exactly what `publish` is about to ship.
  build:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-ruby-go-{{ checksum "go.sum" }}-
            - setup-ruby-go-
      - run: task dry-run
      - run: task build-acceptance
      - run: task build-tools
      - persist_to_workspace:
          root: .
          paths:
            - dist

  smoke:
    description: >-
      Let setup-ruby pick where ruby goes on this executor's real PATH, then
      resolve ruby, gem, bundle and what gem installed by name in processes
      that sourced nothing.

      Everything runs from the workspace, so the executor needs no Go, no
      modules and no checkout: the suite is a cross-compiled test binary, and
      test2json and gotestsum turn its output into the JUnit CircleCI collects.
    parameters:
      e:
        type: executor
        description: The executor to smoke test on.
      platform:
        type: string
        description: The os/arch whose artifacts to run, e.g. linux/amd64.
      ext:
        type: string
        default: ""
        description: Executable suffix for the platform.
    executor: << parameters.e >>
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install Ruby onto PATH and resolve it afterwards
          command: |
            mkdir -p test-results
            ./dist/tools/<< parameters.platform >>/gotestsum<< parameters.ext >> \
              --junitfile test-results/smoke.xml \
              --format standard-verbose \
              --raw-command -- \
              ./dist/tools/<< parameters.platform >>/test2json<< parameters.ext >> \
                -p acceptance \
                ./dist/acceptance/<< parameters.platform >>/acceptance<< parameters.ext >> \
                -test.v=test2json -test.run TestAcceptance_InstallsOntoTheRealPath -test.timeout 20m
          environment:
            SETUP_RUBY_BINARY: ./dist/setup-ruby/<< parameters.platform >>/setup-ruby<< parameters.ext >>
            SETUP_RUBY_ACCEPTANCE_VERSION: << pipeline.parameters.ruby-version >>
      - store_test_results:
          path: test-results

  publish:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-ruby-go-{{ checksum "go.sum" }}-
            - setup-ruby-go-
      - toolkit/setup-aws-oidc:
          role_arn: $FUNCTIONS_PUBLISHER_ROLE_ARN
      - run:
          name: Extract version from tag
          command: |
            VERSION="${CIRCLE_TAG}-$(git rev-parse --short HEAD)"
            echo "export VERSION=$VERSION" >> "$BASH_ENV"
      - run:
          name: Build and publish
          command: task publish VERSION="$VERSION"

workflows:
  test-publish:
    jobs:
      - test:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - acceptance:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - build:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - smoke:
          name: smoke-linux-amd64
          e: base
          platform: linux/amd64
          requires: [build]
          filters:
            tags:
              only: /.*/
      - smoke:
          name: smoke-linux-arm64
          e: arm64
          platform: linux/arm64
          requires: [build]
          filters:
            tags:
              only: /.*/
      - smoke:
          name: smoke-alpine
          e: alpine
          platform: linux/amd64
          requires: [build]
          filters:
            tags:
              only: /.*/
      - smoke:
          name: smoke-ubi
          e: ubi
          platform: linux/amd64
          requires: [build]
          filters:
            tags:
              only: /.*/
      - smoke:
          name: smoke-macos
          e: macos
          platform: darwin/arm64
          requires: [build]
          filters:
            tags:
              only: /.*/
      - smoke:
          name: smoke-windows
          e: windows
          platform: windows/amd64
          ext: ".exe"
          requires: [build]
          filters:
            tags:
              only: /.*/
      - publish:
          requires:
            - test
            - acceptance
            - smoke-linux-amd64
            - smoke-linux-arm64
            - smoke-alpine
            - smoke-ubi
            - smoke-macos
            - smoke-windows
          context: [functions-publisher, github-readonly]
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
