version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

executors:
  go:
    docker:
      - image: cimg/go:1.26
  ruby:
    docker:
      - image: cimg/ruby:3.3

jobs:
  test:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-ruby-go-{{ checksum "go.sum" }}-
            - setup-ruby-go-
      - run: task lint
      - run: task test
      - save_cache:
          key: setup-ruby-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  build:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-ruby-go-{{ checksum "go.sum" }}-
            - setup-ruby-go-
      - run: task dry-run
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Runs the freshly cross-compiled binary against a real Ruby image and
  # asserts it actually installs gems, not just that it exits zero.
  smoke-test:
    executor: ruby
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-deps installs gems
          command: |
            BIN="$PWD/dist/setup-ruby/linux/amd64/setup-ruby"
            APP=$(mktemp -d)
            cd "$APP"
            printf 'source "https://rubygems.org"\ngem "rake"\n' > Gemfile
            bundle lock
            "$BIN" install-deps --app-dir "$APP"
            bundle exec rake --version

  publish:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-ruby-go-{{ checksum "go.sum" }}-
            - setup-ruby-go-
      - toolkit/setup-aws-oidc:
          role_arn: $FUNCTIONS_PUBLISHER_ROLE_ARN
      - run:
          name: Extract version from tag
          command: |
            VERSION="${CIRCLE_TAG}-$(git rev-parse --short HEAD)"
            echo "export VERSION=$VERSION" >> "$BASH_ENV"
      - run:
          name: Build and publish
          command: task publish VERSION="$VERSION"

workflows:
  test-publish:
    jobs:
      - test:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - build:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - smoke-test:
          requires: [build]
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - publish:
          requires: [test, build, smoke-test]
          context: [functions-publisher, github-readonly]
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
